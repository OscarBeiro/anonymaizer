<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f8fc" />
    <!-- P17: set data-theme before the bundle loads, or a dark-mode user sees
         a light flash. Mirrors applyTheme() in src/lib/theme.ts and reads
         THEME_KEY from src/lib/session.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('anonymaizer.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#16171d' : '#f5f8fc');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnonymAIzer — anonymize text before sending it to an AI</title>
    <!-- P19: SEO/social meta. All same-origin or inert: no hosted font, script
         or image is fetched at runtime. Root.tsx updates title/canonical per route. -->
    <meta name="description" content="Replace names, IDs, bank details and other personal data with placeholders before pasting text into an AI, then restore them in the reply. Runs entirely in your browser — nothing is uploaded." />
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnonymAIzer" />
    <meta property="og:title" content="AnonymAIzer — anonymize text before sending it to an AI" />
    <meta property="og:description" content="Placeholders in, real values back. No backend, nothing uploaded, works offline." />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnonymAIzer — anonymize text before sending it to an AI" />
    <meta name="twitter:description" content="Placeholders in, real values back. No backend, nothing uploaded, works offline." />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
